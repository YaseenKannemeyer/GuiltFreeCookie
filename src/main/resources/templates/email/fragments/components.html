<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<table th:fragment="header" role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="background:#2E0E0B;padding:24px;text-align:center"><a th:href="${frontendBase}"><img th:src="${publicBase + '/email/wordmark@2x.png'}" alt="GuiltFreeCookie" width="280" height="64" style="width:280px;max-width:100%;height:auto;border:0" /></a></td></tr></table>
<table th:fragment="hero(headline)" role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="background:#D0AB7B;padding:32px 24px;text-align:center"><h1 th:text="${headline}" style="font-family:'Luckiest Guy','Arial Black',Arial,sans-serif;font-size:36px;line-height:1.15;margin:0 0 20px;color:#2E0E0B"></h1><img th:src="${heroImage}" alt="A freshly baked GuiltFreeCookie" width="160" height="160" style="width:160px;height:160px;object-fit:contain" /></td></tr></table>
<table th:fragment="button" role="presentation" cellspacing="0" cellpadding="0" style="margin:24px auto"><tr><td align="center"><th:block th:utext="${ctaVml}"></th:block><!--[if !mso]><!--><a th:href="${actionUrl}" th:text="${actionLabel}" style="background:#C59F71;color:#2E0E0B;border-radius:999px;display:inline-block;line-height:24px;padding:14px 28px;font-weight:800;text-decoration:none;mso-hide:all"></a><!--<![endif]--></td></tr></table>
<table th:fragment="product(product)" role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:8px"><a th:href="${product.url}" style="color:#9A6E45"><img th:src="${product.imageUrl}" th:alt="${product.name}" width="240" height="300" style="width:100%;max-width:240px;height:auto;background:#F5F0E6;border:0" /><p th:text="${product.name}" style="font-weight:bold"></p></a><p>From <span th:text="${product.price}"></span></p></td></tr></table>
<table th:fragment="products" role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td th:each="product : ${products}" width="50%" valign="top"><table th:replace="~{email/fragments/components :: product(${product})}"></table></td></tr></table>
<table th:fragment="order" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:15px"><caption style="text-align:left;font-weight:bold;padding:16px 0">Your order <span th:text="${orderNumber}"></span></caption><thead><tr><th scope="col" style="text-align:left;padding:10px 4px;border-bottom:2px solid #C59F71">Cookie / pack</th><th scope="col" style="padding:10px 4px">Qty</th><th scope="col" style="text-align:right;padding:10px 4px">Total</th></tr></thead><tbody><tr th:each="item : ${items}"><td style="padding:12px 4px;border-bottom:1px solid #E3D9C8"><span th:text="${item.name}"></span><br/><span th:text="${item.variant}"></span></td><td th:text="${item.quantity}" style="text-align:center;padding:12px 4px"></td><td th:text="${item.lineTotal}" style="text-align:right;padding:12px 4px"></td></tr><tr><td colspan="2" style="padding:8px 4px">Subtotal</td><td th:text="${subtotal}" style="text-align:right"></td></tr><tr th:if="${discount != null}"><td colspan="2" style="padding:8px 4px">Discount</td><td th:text="${discount}" style="text-align:right"></td></tr><tr><td colspan="2" style="padding:8px 4px">Delivery</td><td th:text="${shipping}" style="text-align:right"></td></tr><tr th:if="${vat != null}"><td colspan="2" style="padding:8px 4px">VAT included</td><td th:text="${vat}" style="text-align:right"></td></tr><tr><th colspan="2" scope="row" style="text-align:left;padding:16px 4px;border-top:2px solid #C59F71">Total</th><td th:text="${total}" style="text-align:right;font-weight:bold;border-top:2px solid #C59F71"></td></tr></tbody></table>
<table th:fragment="discount" role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border:2px dashed #C59F71;text-align:center;padding:24px"><p style="margin:0">A little treat for next time</p><p th:text="${discountCode}" style="font-family:'Luckiest Guy','Arial Black',Arial;font-size:28px"></p><p>Use by <span th:text="${discountExpiry}"></span></p></td></tr></table>
<table th:fragment="review" role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:24px;background:#F5F0E6"><p aria-label="5 out of 5 stars" style="color:#9A6E45">★★★★★</p><p th:text="${quote}"></p><p th:text="${quoteAuthor}" style="font-weight:bold"></p></td></tr></table>
<table th:fragment="founder" role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:24px 0"><img th:if="${!site.setting('founder-photo-url').isEmpty()}" th:src="${site.setting('founder-photo-url')}" alt="A note from our founder" width="64" height="64" style="border-radius:50%"/><p th:text="${site.setting('founder-message')}"></p><p th:text="${site.setting('founder-name')}" style="font-weight:bold"></p></td></tr></table>
<table th:fragment="footer" role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="background:#2E0E0B;color:#F5F0E6;padding:28px 24px;font-size:13px;line-height:1.6;text-align:center"><p th:text="${site.setting('address')}"></p><p><a th:href="${'mailto:' + site.setting('support-email')}" th:text="${site.setting('support-email')}" style="color:#C59F71"></a></p><p><a th:each="network : ${ {'instagram','facebook','tiktok'} }" th:if="${!site.setting(network).isEmpty()}" th:href="${site.setting(network)}" th:text="${network + ' '}" style="color:#C59F71;padding:8px"></a></p><p th:text="${marketing ? 'You received this email because you opted in to bakery news.' : 'You received this email about your account, order or message to GuiltFreeCookie.'}"></p><a th:if="${marketing}" th:href="${unsubscribeUrl}" style="color:#C59F71">Unsubscribe</a></td></tr></table>
</body></html>
