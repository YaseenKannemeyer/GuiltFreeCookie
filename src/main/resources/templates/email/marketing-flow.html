<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="light"/><meta name="supported-color-schemes" content="light"/><link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;family=Nunito:wght@400;700;800&amp;display=swap" rel="stylesheet"/><title>GuiltFreeCookie</title></head><body style="margin:0;padding:0;background:#E3D9C8;color:#2E0E0B;font-family:Nunito,'Trebuchet MS',Arial,sans-serif;font-size:16px;line-height:1.6"><div th:text="${preheader}" style="display:none;max-height:0;overflow:hidden;mso-hide:all"></div><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E3D9C8"><tr><td align="center" style="padding:24px 8px"><!--[if mso]><table role="presentation" width="600"><tr><td><![endif]--><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#F5F0E6"><tr><td><table th:replace="~{email/fragments/components :: header}"></table><table th:replace="~{email/fragments/components :: hero(${headline})}"></table></td></tr><tr><td style="padding:28px 24px 8px">
<p th:each="paragraph : ${paragraphs}" th:text="${paragraph}" style="margin:0 0 16px"></p>
<table th:if="${bullets != null and !bullets.isEmpty()}" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px"><tr th:each="bullet : ${bullets}"><td valign="top" width="24" style="color:#9A6E45;font-weight:800;padding:4px 0">&#8226;</td><td th:text="${bullet}" style="padding:4px 0"></td></tr></table>
<p th:if="${closing != null}" th:text="${closing}" style="margin:0 0 16px"></p>
<table th:if="${discountCode != null}" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:8px 0 16px"><tr><td style="border:2px dashed #C59F71;border-radius:16px;text-align:center;padding:20px 16px;background:#FFFFFF"><p style="margin:0;font-size:14px;font-weight:800;color:#2E0E0B">Your code</p><p th:text="${discountCode}" style="margin:6px 0;font-family:'Luckiest Guy','Arial Black',Arial,sans-serif;font-size:30px;letter-spacing:1px;color:#2E0E0B"></p><p th:if="${discountExpiry != null}" style="margin:0;font-size:14px">Use it by <span th:text="${discountExpiry}"></span>. Enter it in your cart.</p></td></tr></table>
<table th:if="${cartItems != null and !cartItems.isEmpty()}" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:8px 0 8px;border-top:1px solid #E3D9C8"><tr th:each="item : ${cartItems}"><td width="72" style="padding:12px 12px 12px 0;border-bottom:1px solid #E3D9C8"><img th:src="${item.imageUrl}" th:alt="${item.name}" width="64" height="64" style="display:block;width:64px;height:64px;border-radius:12px;background:#E3D9C8;border:0"/></td><td style="padding:12px 0;border-bottom:1px solid #E3D9C8"><span th:text="${item.name}" style="font-weight:800"></span><br/><span style="font-size:14px"><span th:text="${item.variant}"></span> &#215; <span th:text="${item.quantity}"></span></span></td><td th:text="${item.lineTotal}" align="right" style="padding:12px 0;border-bottom:1px solid #E3D9C8;white-space:nowrap"></td></tr></table>
</td></tr>
<tr th:if="${products != null and !products.isEmpty()}"><td style="padding:0 16px"><table th:replace="~{email/fragments/components :: products}"></table></td></tr>
<tr th:if="${reviews != null and !reviews.isEmpty()}"><td style="padding:8px 24px"><table th:each="review : ${reviews}" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 12px"><tr><td style="padding:20px;background:#FFFFFF;border-radius:16px"><p th:text="${review.stars}" th:attr="aria-label=${review.rating + ' out of 5 stars'}" style="margin:0 0 8px;color:#9A6E45;letter-spacing:2px"></p><p th:text="${review.quote}" style="margin:0 0 8px"></p><p th:text="${review.author}" style="margin:0;font-weight:800;font-size:14px"></p></td></tr></table></td></tr>
<tr><td style="padding:0 24px 8px"><table th:replace="~{email/fragments/components :: button}"></table><th:block th:if="${showFounder}"><table th:replace="~{email/fragments/components :: founder}"></table></th:block></td></tr>
<tr><td><table th:replace="~{email/fragments/components :: footer}"></table></td></tr></table><!--[if mso]></td></tr></table><![endif]--></td></tr></table><img th:if="${pixelUrl != null}" th:src="${pixelUrl}" alt="" width="1" height="1" style="display:block;width:1px;height:1px;border:0"/></body></html>
