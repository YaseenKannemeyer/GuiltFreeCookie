<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="light"/><link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;family=Nunito:wght@400;700;800&amp;display=swap" rel="stylesheet"/><title>GuiltFreeCookie</title></head><body style="margin:0;padding:0;background:#E3D9C8;color:#2E0E0B;font-family:Nunito,'Trebuchet MS',Arial,sans-serif;font-size:16px;line-height:1.6"><div style="display:none;max-height:0;overflow:hidden;mso-hide:all">Thank you for your order.</div><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E3D9C8"><tr><td align="center" style="padding:24px 8px"><!--[if mso]><table role="presentation" width="600"><tr><td><![endif]--><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#F5F0E6"><tr><td><table th:replace="~{email/fragments/components :: header}"></table><table th:replace="~{email/fragments/components :: hero('You made our day')}"></table></td></tr><tr><td style="padding:24px"><p>Hi <span th:text="${name}"></span>, thank you for choosing GuiltFreeCookie.</p><table th:replace="~{email/fragments/components :: order}"></table><p th:if="${invoiceUrl != null}" style="margin:16px 0 0"><a th:href="${invoiceUrl}" style="color:#9A6E45;font-weight:800">Download your invoice (PDF)</a></p><h2 style="font-size:20px">Delivery or collection</h2><p th:if="${deliveryDetails != null}" th:text="${deliveryDetails}" style="white-space:pre-wrap"></p><p th:if="${pickupDetails != null}" th:text="${pickupDetails}" style="white-space:pre-wrap"></p><table th:replace="~{email/fragments/components :: button}"></table><table th:replace="~{email/fragments/components :: founder}"></table></td></tr><tr><td><table th:replace="~{email/fragments/components :: footer}"></table></td></tr></table><!--[if mso]></td></tr></table><![endif]--></td></tr></table></body></html>
