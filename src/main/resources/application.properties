spring.application.name=guiltFreeCookie

# Secrets never live in this file. Set them as environment variables, or for
# local development copy .env.example to .env (git-ignored) and fill it in.
spring.config.import=optional:file:.env[.properties]

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/guiltFreeCookie?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Server ----
server.servlet.context-path=/guiltFreeCookie
server.port=${PORT:${SERVER_PORT:8080}}

# Never leak internals in error responses.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Trust X-Forwarded-* only from proxies on private networks (Tomcat's default
# internal-proxies list), so HTTPS detection and rate limiting see the real
# client. Behind a public CDN, set server.tomcat.remoteip.internal-proxies.
server.forward-headers-strategy=native

# The API is stateless (bearer tokens), so it never sets a session cookie.
# These settings are a backstop in case anything ever creates one.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ---- Uploads ----
app.upload.root-dir=${UPLOAD_DIR:uploads}
app.upload.cookie-subdir=cookies
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# ---- Auth ----
# Base64-encoded, at least 32 bytes. Generate one with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---- Browser access ----
# Comma-separated origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
# Redirect plain HTTP to HTTPS (turn on wherever the API is served over TLS).
app.security.require-https=${REQUIRE_HTTPS:false}

# ---- Rate limits (requests per client IP per window) ----
app.rate-limit.login.requests=10
app.rate-limit.login.window-seconds=300
app.rate-limit.newsletter.requests=5
app.rate-limit.newsletter.window-seconds=3600
app.rate-limit.customer-auth.requests=10
app.rate-limit.customer-auth.window-seconds=300
app.rate-limit.contact.requests=5
app.rate-limit.contact.window-seconds=3600
app.rate-limit.cart-create.requests=30
app.rate-limit.cart-create.window-seconds=3600
app.rate-limit.checkout.requests=20
app.rate-limit.checkout.window-seconds=3600
app.rate-limit.review-link.requests=10
app.rate-limit.review-link.window-seconds=3600
app.rate-limit.api.requests=300
app.rate-limit.api.window-seconds=60

# ---- API docs (Swagger UI at /guiltFreeCookie/swagger-ui.html) ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Customer accounts ----
# Where links in emails (password reset etc.) point.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.auth.password-reset-minutes=60

# ---- Email ----
# Off by default: emails are logged instead of sent. For local testing run
# Mailpit (brew install mailpit) and set MAIL_ENABLED=true.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Guilt Free Cookie <hello@guiltfreecookie.co.za>}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Transactional messages survive restarts and retry at 1, 5, 15 and 60 minutes.
app.mail.delivery-check-ms=5000
app.mail.cleanup-ms=3600000

# ---- Catalog ----
# A cookie shows "low stock" at or below this many cookies, unless it sets its own threshold.
app.catalog.default-low-stock-threshold=12

# ---- Cart & pricing ----
# Prices are VAT-inclusive. When VAT-registered, receipts show the VAT portion.
app.vat.registered=${VAT_REGISTERED:false}
app.vat.rate=0.15
# Printed on tax invoices once VAT-registered.
app.vat.number=${VAT_NUMBER:}

# ---- Phase 6: email assets and shop identity ----
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080/guiltFreeCookie}
app.site.support-email=${SITE_SUPPORT_EMAIL:hello@guiltfreecookie.co.za}
app.site.phone=${SITE_PHONE:}
app.site.whatsapp=${SITE_WHATSAPP:}
app.site.hours=${SITE_HOURS:Mon–Fri 08:00–17:00}
app.site.response-time=${SITE_RESPONSE_TIME:We reply within 1 business day}
app.site.address=${SITE_ADDRESS:Cape Town, South Africa}
app.site.instagram=${SITE_INSTAGRAM:}
app.site.facebook=${SITE_FACEBOOK:}
app.site.tiktok=${SITE_TIKTOK:}
app.site.founder-name=${SITE_FOUNDER_NAME:The GuiltFreeCookie team}
app.site.founder-message=${SITE_FOUNDER_MESSAGE:Thank you for supporting our small-batch bakery. We hope every bite makes your day a little sweeter.}
app.site.founder-photo-url=${SITE_FOUNDER_PHOTO_URL:}

# ---- Shipping (defaults; admins edit them at /api/v1/admin/shipping-settings) ----
app.shipping.courier-rate=${SHIPPING_COURIER_RATE:80.00}
app.shipping.pudo-rate=${SHIPPING_PUDO_RATE:60.00}
# Off until the shop has a locker service. Only seeds new databases; admins switch it in shipping settings.
app.shipping.pudo-enabled=${SHIPPING_PUDO_ENABLED:false}
app.shipping.free-threshold=${SHIPPING_FREE_THRESHOLD:750.00}
app.shipping.pickup-address=${SHIPPING_PICKUP_ADDRESS:Strandfontein, Cape Town (exact address sent with your order)}
app.shipping.pickup-instructions=${SHIPPING_PICKUP_INSTRUCTIONS:Bring your order number. We'll email you when it's ready.}

# ---- Live courier rates: ShipLogic (The Courier Guy) ----
# A blank key keeps the flat courier rate. The key decides sandbox or live; both use the same host.
app.shiplogic.api-key=${SHIPLOGIC_API_KEY:}
app.shiplogic.base-url=https://api.shiplogic.com
# Service levels the customer is quoted from (the cheapest wins). Flyer services need a courier satchel, not a box.
app.shiplogic.service-levels=${SHIPLOGIC_SERVICE_LEVELS:ECO}
app.shiplogic.collection.company=Guilt Free Cookie
app.shiplogic.collection.street-address=${SHIPLOGIC_COLLECTION_STREET:27 Spine Road}
app.shiplogic.collection.suburb=${SHIPLOGIC_COLLECTION_SUBURB:Strandfontein}
app.shiplogic.collection.city=${SHIPLOGIC_COLLECTION_CITY:Cape Town}
app.shiplogic.collection.province=${SHIPLOGIC_COLLECTION_PROVINCE:WESTERN_CAPE}
app.shiplogic.collection.postal-code=${SHIPLOGIC_COLLECTION_POSTAL_CODE:7798}
# Who the courier calls at collection. Demo figures until the shop is real.
app.shiplogic.collection.contact-name=Guilt Free Cookie
app.shiplogic.collection.contact-phone=${SHIPLOGIC_COLLECTION_PHONE:0215550123}
# ShipLogic refuses an email whose domain doesn't exist, such as the demo's example.test.
app.shiplogic.collection.contact-email=${SHIPLOGIC_COLLECTION_EMAIL:${app.site.support-email}}
# Couriers are booked only on these days, so parcels don't sit in a depot over the weekend.
app.shiplogic.booking-days=${SHIPLOGIC_BOOKING_DAYS:MONDAY,TUESDAY,WEDNESDAY}
# The customer's tracking link. {ref} is the tracking number.
app.shiplogic.tracking-url=${SHIPLOGIC_TRACKING_URL:https://portal.thecourierguy.co.za/track?ref={ref}}
# How often shipped parcels are checked for delivery (milliseconds).
app.shiplogic.tracking-check-ms=1800000
# The courier box: the Box of 24 with its packing. Demo figures, not measured.
app.shiplogic.box.length-cm=32
app.shiplogic.box.width-cm=24
app.shiplogic.box.height-cm=10
app.shiplogic.box.empty-grams=280
app.shiplogic.box.grams-per-cookie=45
app.shiplogic.box.cookies-per-box=24

# ---- Address search at checkout: Google Places (New) ----
# A blank key hides the search box; customers type their address as before.
app.address-search.google-api-key=${GOOGLE_PLACES_API_KEY:}

# ---- Orders & PayFast ----
# The cart subtotal (before discounts and delivery) needed to check out. 0 switches the minimum off.
app.order.minimum-subtotal=${ORDER_MINIMUM_SUBTOTAL:300.00}
# Stock is held this long while the customer pays; then unpaid orders are cancelled.
app.order.payment-window-minutes=30
app.order.expiry-check-ms=300000
# Signs guests' order links. Defaults to the JWT secret; set it to rotate links separately.
app.order.link-secret=${ORDER_LINK_SECRET:${app.jwt.secret}}
# Sandbox defaults are PayFast's public test merchant. Set real values in production.
app.payfast.sandbox=${PAYFAST_SANDBOX:true}
app.payfast.merchant-id=${PAYFAST_MERCHANT_ID:10000100}
app.payfast.merchant-key=${PAYFAST_MERCHANT_KEY:46f0cd694581a}
app.payfast.passphrase=${PAYFAST_PASSPHRASE:jt7NOE43FZPn}
# Must be reachable by PayFast (use a tunnel such as cloudflared when testing locally).
app.payfast.notify-url=${PAYFAST_NOTIFY_URL:${app.public-base-url}/api/v1/payments/payfast/notify}
app.payfast.verify-source-ip=${PAYFAST_VERIFY_SOURCE_IP:true}
app.payfast.verify-with-server=${PAYFAST_VERIFY_WITH_SERVER:true}

# ---- Email flows (Phase 7; admins tune them at /api/v1/admin/email-flows) ----
# Signs unsubscribe links. Defaults to the JWT secret; set it to rotate those links separately.
app.email.link-secret=${EMAIL_LINK_SECRET:${app.jwt.secret}}
# Seeds the admin settings the first time they're read. FLOWS_ENABLED=false starts with every flow off.
app.flows.enabled=${FLOWS_ENABLED:true}
app.flows.welcome-discount-percent=10
app.flows.welcome-code-days=5
app.flows.cart-discount-percent=10
app.flows.winback-discount-percent=15
app.flows.replenishment-days=21
app.flows.winback-days=60
app.flows.sunset-days=90
# How often due flow emails go out, and how often idle carts are checked (milliseconds).
app.flows.run-ms=300000
app.flows.cart-check-ms=900000
# Winback and sunset checks, in shop time (Africa/Johannesburg). "-" switches the daily check off.
app.flows.daily-cron=0 0 9 * * *

# ---- Customer accounts (Phase 5) ----
# Signs the emailed links that add earlier guest orders to an account. Defaults to the JWT secret.
app.account.claim-secret=${ACCOUNT_CLAIM_SECRET:${app.jwt.secret}}

# ---- First admin (Phase 8) ----
# Only used when the admins table is empty. Remove the password once you've signed in and changed it.
app.bootstrap.admin-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# ---- Health check (Phase 8) ----
# GET /guiltFreeCookie/actuator/health answers {"status":"UP"} for the host's uptime checks. Nothing else is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Provider outages alert the operator without failing Azure's readiness probe.
management.health.mail.enabled=${app.mail.enabled}
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.dependencies.include=mail,outbox,delivery
management.endpoint.health.validate-group-membership=false

# Metrics to Grafana Cloud over OTLP, once a minute; off until OTLP_METRICS_URL and the token are set.
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.headers.Authorization=${OTLP_METRICS_AUTHORIZATION:}
management.otlp.metrics.export.step=1m
# Spring's default is 1 s, too short from South Africa to Grafana's EU gateway while the app warms up.
management.otlp.metrics.export.connect-timeout=10s
management.metrics.tags.application=guiltfreecookie-api
management.metrics.tags.environment=${SENTRY_ENVIRONMENT:local}

# ---- Monitoring ----
# Better Stack heartbeat URLs, pinged when each job finishes. Blank turns that heartbeat off.
app.heartbeat.reservations-url=${HEARTBEAT_RESERVATIONS_URL:}
app.heartbeat.daily-flows-url=${HEARTBEAT_DAILY_FLOWS_URL:}
# Sentry error reporting. A blank DSN turns it off. Never send personal data (POPIA).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.send-default-pii=${SENTRY_SEND_DEFAULT_PII:false}
