# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# Every value here must come from the environment: no local defaults.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}

# Never let the app rewrite the production schema. For the very first deploy
# against an empty database, set JPA_DDL_AUTO=update once, then remove it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.require-https=${REQUIRE_HTTPS:true}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

logging.level.root=WARN
logging.level.za.ac.cput.guiltfreecookie=INFO

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

app.mail.enabled=${MAIL_ENABLED:true}
app.frontend.base-url=${FRONTEND_BASE_URL}

# No sandbox fallbacks in production: these must be set explicitly.
app.payfast.sandbox=${PAYFAST_SANDBOX}
app.payfast.merchant-id=${PAYFAST_MERCHANT_ID}
app.payfast.merchant-key=${PAYFAST_MERCHANT_KEY}
app.payfast.passphrase=${PAYFAST_PASSPHRASE}
app.payfast.verify-source-ip=true
app.payfast.verify-with-server=true
