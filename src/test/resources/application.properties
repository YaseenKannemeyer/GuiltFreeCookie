spring.application.name=guiltFreeCookie

spring.datasource.url=jdbc:h2:mem:gfc;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.servlet.context-path=/guiltFreeCookie

app.upload.root-dir=target/test-uploads
app.upload.cookie-subdir=cookies

app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC10aGF0LWlzLTMyLWJ5dGVzISE=
app.jwt.expiration-minutes=60

app.cors.allowed-origins=http://localhost:5173
app.security.require-https=false

app.rate-limit.login.requests=10
app.rate-limit.login.window-seconds=300
app.rate-limit.newsletter.requests=5
app.rate-limit.newsletter.window-seconds=3600
app.rate-limit.api.requests=300
app.rate-limit.api.window-seconds=60
